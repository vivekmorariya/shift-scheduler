{% extends "base.html" %}
{% block title %}New Schedule – Shift Scheduler{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Generate New Schedule</h5>
      </div>
      <div class="card-body p-4">
        <p class="text-muted">Select the year and month for the schedule you want to generate.</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Year</label>
            <select name="year" class="form-select form-select-lg" required>
              {% for y in years %}
                <option value="{{ y }}" {% if y == default_year %}selected{% endif %}>{{ y }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Month</label>
            <select name="month" class="form-select form-select-lg" required>
              {% for i in range(1, 13) %}
                {% set month_names = ['January','February','March','April','May','June',
                                      'July','August','September','October','November','December'] %}
                <option value="{{ i }}" {% if i == default_month %}selected{% endif %}>
                  {{ month_names[i-1] }}
                </option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100 btn-lg">
            <i class="bi bi-arrow-right-circle"></i> Continue to Setup
          </button>
        </form>
      </div>
    </div>
    <a href="{{ url_for('index') }}" class="btn btn-link mt-2">← Back to Dashboard</a>
  </div>
</div>
{% endblock %}
